<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Gap Map App</title>
<meta name="description" content="Find the skills that bring the most real job postings within reach. Runs fully in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230b0a1a'/><path d='M12 50 H24 V38 H36 V26 H48 V14' fill='none' stroke='%23a497ff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='48' cy='14' r='6' fill='%23f5b033'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f6f5fb; --ink: #110e2b; --ink-2: #46435f; --track: #e2e0ef; --brand: #5b45e0; --gold: #b7791f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0a1a; --ink: #efedff; --ink-2: #bdb9d8; --track: #2a2748; --brand: #a497ff; --gold: #f5b033; } }
  :root[data-theme="dark"] { --bg: #0b0a1a; --ink: #efedff; --ink-2: #bdb9d8; --track: #2a2748; --brand: #a497ff; --gold: #f5b033; }
  html, body { margin: 0; background: var(--bg); }
  #loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: var(--bg); color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity .5s; }
  #loader.done { opacity: 0; pointer-events: none; }
  .box { text-align: center; padding: 0 20px; max-width: 440px; }
  svg.stairs { width: 150px; height: 110px; overflow: visible; }
  svg.stairs path { stroke: var(--brand); stroke-dasharray: 220; stroke-dashoffset: 220; animation: climb 2.4s ease-in-out infinite; }
  svg.stairs circle { fill: var(--gold); animation: pop 2.4s ease-in-out infinite; transform-origin: 120px 14px; }
  @keyframes climb { 0% { stroke-dashoffset: 220; } 60%, 100% { stroke-dashoffset: 0; } }
  @keyframes pop { 0%, 55% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
  h1 { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 30px; margin: 14px 0 4px; letter-spacing: -0.02em; }
  #status { color: var(--ink-2); font-size: 15px; min-height: 1.4em; }
  .bar { height: 4px; width: 220px; margin: 18px auto 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar b { display: block; height: 100%; width: 35%; border-radius: 99px; background: linear-gradient(90deg, var(--brand), var(--gold));
           animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  .note { color: var(--ink-2); font-size: 12.5px; opacity: .85; line-height: 1.5; }
  .note a { color: var(--brand); }
  @media (prefers-reduced-motion: reduce) { svg.stairs path, svg.stairs circle, .bar b { animation: none; stroke-dashoffset: 0; } }
</style>
</head>
<body>
<div id="loader" role="status" aria-live="polite">
  <div class="box">
    <svg class="stairs" viewBox="0 0 150 110" aria-hidden="true">
      <path d="M10 100 H40 V75 H70 V50 H100 V25 H120 V14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="120" cy="14" r="8"/>
    </svg>
    <h1>Skill Gap Map</h1>
    <div id="status">Opening 12,800 job postings…</div>
    <div class="bar"><b></b></div>
    <div class="note">Runs entirely in your browser: your resume never leaves it. The first visit downloads Python, so give it a moment.
      <br><a href="../">Back to the overview</a></div>
  </div>
</div>
<div id="root"></div>
<script type="module">
  import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
  const src = name => ({ url: new URL(`src/${name}`, location.href).href });
  mount({
    entrypoint: "app.py",
    requirements: ["numpy", "pandas", "plotly"],
    files: {
      "app.py": src("app.py"), "gap_engine.py": src("gap_engine.py"), "skills.py": src("skills.py"), "ui.py": src("ui.py"),
      ".streamlit/config.toml": src("streamlit-config.toml"),
      "data/postings.csv.gz": src("postings.csv.gz"), "data/coverage.json": src("coverage.json"),
    },
  }, document.getElementById("root"));
  const status = document.getElementById("status"), loader = document.getElementById("loader");
  const steps = ["Opening 12,800 job postings…", "Loading Python into your browser…", "Reading what employers ask for…",
                 "Planning your next skills…", "Almost ready…"];
  let i = 0;
  const t = setInterval(() => { i = Math.min(i + 1, steps.length - 1); status.textContent = steps[i]; }, 3500);
  const ready = () => document.querySelector(".hero") || document.querySelector('[data-testid="stException"]');
  const obs = new MutationObserver(() => {
    if (ready()) { clearInterval(t); loader.classList.add("done"); obs.disconnect(); setTimeout(() => loader.remove(), 600); }
  });
  obs.observe(document.body, { childList: true, subtree: true });
</script>
</body>
</html>
